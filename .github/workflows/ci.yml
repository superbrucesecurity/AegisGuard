name: CI

on:
  push:
    branches: [main, dev/v3.0, dev/v3.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Restore
        run: dotnet restore AegisGuard.slnx --nologo
        shell: pwsh

      - name: Build Debug
        run: dotnet build AegisGuard.slnx -c Debug --no-restore --nologo
        shell: pwsh

      - name: Build Release
        run: dotnet build AegisGuard.slnx -c Release --no-restore --nologo
        shell: pwsh

      - name: Test
        run: dotnet test tests/Aegis.Checks/Aegis.Checks.csproj -c Release --no-build --nologo --logger "trx;LogFileName=results.trx"
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

      - name: SBOM, deploy scripts and unsigned stage
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'aegis-check-ci.log'
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deploy\Check-Ci.ps1 2>&1 |
              Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "Check-Ci.ps1 terminó con código $LASTEXITCODE" }
          }
          catch {
            $tail = if (Test-Path -LiteralPath $log) { (Get-Content -LiteralPath $log -Tail 80) -join "`n" } else { '' }
            $message = ($_.Exception.Message + "`n" + $tail) -replace "`r?`n", '%0A'
            Write-Host "::error::Check-Ci.ps1 falló: $message"
            exit 1
          }
